name: Validate site build

# This does NOT deploy the site — GitHub Pages still builds and deploys on
# its own via Settings > Pages. This workflow just runs the same `jekyll
# build` on every push/PR so a broken _data/*.yml or _people/*.md front
# matter shows up as a red X on the commit right away, instead of silently
# breaking the live site until someone notices.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build site with Jekyll
        run: bundle exec jekyll build
