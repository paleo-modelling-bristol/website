name: Validate site build

# This does NOT deploy the site — GitHub Pages still builds and deploys on
# its own via Settings > Pages. This workflow runs the same `jekyll build`
# on every push/PR so a broken _data/*.yml file shows up as a red X right
# away instead of silently breaking the whole site. It also separately
# checks that every _people/*.md file's name/section/role actually parsed
# to a non-empty value — a broken front matter block in one person's file
# doesn't fail `jekyll build` at all, it just silently renders that one
# page blank, so the build step alone can't catch it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build site with Jekyll
        run: bundle exec jekyll build

      - name: Check required fields on _people/*.md
        run: ruby .github/scripts/check_people.rb
