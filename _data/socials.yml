# Edit this file to add real event photos.
# Each section is one event. tag must be one of: fieldwork / conference / social
#
# To add a real photo to a section's `images` list:
#   - src: /assets/images/socials/your-photo.jpg
#     caption: "Caption text"
#     height: 220   # optional — crops to this height (px) instead of the
#                   # photo's natural aspect ratio; omit to use natural size.
#
# To add a real video:
#   - video: /assets/videos/your-video.mp4
#     thumb: /assets/images/socials/your-thumbnail.jpg
#     caption: "Caption text"
#
# Until real photos are added, `placeholder: true` entries render an empty tile
# (same behaviour as the old static site) so the gallery layout still looks right.

